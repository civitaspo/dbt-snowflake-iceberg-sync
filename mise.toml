[tools]
"aqua:astral-sh/uv" = "0.12.23"
"aqua:koalaman/shellcheck" = "0.11.0"
"aqua:orhun/git-cliff" = "2.14.2"
"aqua:suzuki-shunsuke/disable-checkout-persist-credentials" = "1.0.0"
"aqua:suzuki-shunsuke/ghalint" = "1.5.6"
"aqua:suzuki-shunsuke/pinact" = "5.0.0"

[tasks.lint]
description = "Run local workflow and shell lint checks"
run = """
#!/usr/bin/env bash
set -euo pipefail
if [ -d scripts ]; then
  find scripts -type f -name '*.sh' -print0 | xargs -0 -r shellcheck
fi
if [ -d .github/workflows ]; then
  ghalint run
  pinact run --check
fi
"""
