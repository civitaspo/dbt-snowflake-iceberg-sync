# Aggregator for PR/push CI. Called from ci.yml.
# Real work lives in wc-*.yml (Suzuki / Shunsuke pattern).

name: PR checks (reusable)

on:
  workflow_call:
    inputs:
      autofix:
        description: "PR mode: apply autofixes via SecureFix. Push mode: check-only."
        type: boolean
        required: true
      suite:
        description: "full = all jobs; title = pr-title only (PR edited)."
        type: string
        required: true

permissions: {}

jobs:
  tests:
    if: ${{ inputs.suite == 'full' }}
    uses: ./.github/workflows/wc-tests.yml
    permissions:
      contents: read

  fusion-parse:
    if: ${{ inputs.suite == 'full' }}
    uses: ./.github/workflows/wc-fusion-parse.yml
    permissions:
      contents: read

  workflows:
    if: ${{ inputs.suite == 'full' }}
    uses: ./.github/workflows/wc-lint.yml
    with:
      autofix: ${{ inputs.autofix }}
    secrets: inherit
    permissions:
      contents: read

  pr-title:
    if: ${{ inputs.autofix && (inputs.suite == 'full' || inputs.suite == 'title') }}
    uses: ./.github/workflows/wc-pr-title.yml
    permissions:
      pull-requests: read
