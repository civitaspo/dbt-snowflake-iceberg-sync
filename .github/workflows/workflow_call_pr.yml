# Reusable jobs for PR/push CI. Called from ci.yml.
# github.event_name is always workflow_call here — use inputs.autofix for PR vs push behavior.

name: PR checks (reusable)

on:
  workflow_call:
    inputs:
      autofix:
        description: "PR mode: apply autofixes via SecureFix. Push mode: check-only."
        type: boolean
        required: true
      suite:
        description: "full = all jobs; title = pr-title only (PR edited)."
        type: string
        required: true

permissions: {}

env:
  DBT_FUSION_VERSION: "2.0.0-preview.186"
  DBT_FUSION_TARGET: "x86_64-unknown-linux-gnu"

jobs:
  tests:
    if: ${{ inputs.suite == 'full' }}
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.13"

    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up mise
        uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4.0.1
        with:
          version: "2026.5.15"
          install_args: "--locked"
          cache: true

      - name: Install Python dependencies
        run: uv sync --frozen

      - name: Run Python lint
        run: uv run ruff check procedure tests

      - name: Run unit tests
        run: uv run pytest tests/unit

      - name: Parse dbt package
        run: uv run dbt parse --profiles-dir tests/ci_profiles --no-version-check

  fusion-parse:
    if: ${{ inputs.suite == 'full' }}
    name: dbt Fusion parse
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Install dbt Fusion
        env:
          DBT_FUSION_ARCHIVE: ${{ runner.temp }}/dbt-fusion.tar.gz
          DBT_FUSION_BIN_DIR: ${{ runner.temp }}/dbt-fusion/bin
          DBT_FUSION_EXTRACT_DIR: ${{ runner.temp }}/dbt-fusion/extract
        run: |
          mkdir -p "$DBT_FUSION_BIN_DIR" "$DBT_FUSION_EXTRACT_DIR"
          curl --fail --location --retry 3 --retry-all-errors --connect-timeout 10 --max-time 300 \
            --output "$DBT_FUSION_ARCHIVE" \
            "https://public.cdn.getdbt.com/fs/cli/fs-v${DBT_FUSION_VERSION}-${DBT_FUSION_TARGET}.tar.gz"
          tar -xzf "$DBT_FUSION_ARCHIVE" -C "$DBT_FUSION_EXTRACT_DIR"
          install -m 755 "$DBT_FUSION_EXTRACT_DIR/dbt" "$DBT_FUSION_BIN_DIR/dbtf"
          echo "$DBT_FUSION_BIN_DIR" >> "$GITHUB_PATH"

      - name: Show dbt Fusion version
        run: dbtf --version

      - name: Parse dbt package with dbt Fusion
        run: dbtf parse --profiles-dir tests/ci_profiles --no-version-check

  workflows:
    if: ${{ inputs.suite == 'full' }}
    name: GitHub Actions
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    env:
      SECUREFIX_CLIENT_APP_ID: ${{ vars.SECUREFIX_CLIENT_APP_ID }}
      SECUREFIX_SERVER_REPOSITORY: ${{ vars.SECUREFIX_SERVER_REPOSITORY }}

    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Forbid CHANGELOG edits outside release/next
        if: |
          inputs.autofix &&
          !(
            github.head_ref == 'release/next' &&
            github.event.pull_request.head.repo.full_name == github.repository
          )
        run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          if git diff --name-only "${base}...${head}" | grep -qx 'CHANGELOG.md'; then
            echo "CHANGELOG.md is owned by the Release PR (git-cliff)." >&2
            echo "Do not edit it on feature PRs; use Conventional Commit subjects instead." >&2
            echo "See docs/releasing.md." >&2
            exit 1
          fi

      - name: Set up mise
        uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4.0.1
        with:
          version: "2026.5.15"
          install_args: "--locked"
          cache: true

      - name: Fix action pins
        if: inputs.autofix
        env:
          PINACT_GITHUB_TOKEN: ${{ github.token }}
        run: pinact run --verify-comment

      - name: Check action pins
        if: ${{ !inputs.autofix }}
        env:
          PINACT_GITHUB_TOKEN: ${{ github.token }}
        run: pinact run --check --verify-comment

      - name: Disable checkout credentials
        if: inputs.autofix
        run: disable-checkout-persist-credentials

      - name: Ensure checkout credentials are disabled
        if: ${{ !inputs.autofix }}
        run: |
          disable-checkout-persist-credentials
          git diff --exit-code -- .github/workflows

      - name: Run ghalint
        run: ghalint run

      - name: Detect workflow fixes
        if: inputs.autofix
        id: workflow-fixes
        run: |
          if git diff --quiet -- .github/workflows; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "changed=true" >> "$GITHUB_OUTPUT"
          git diff --name-only -- .github/workflows

      - name: Require SecureFix configuration
        if: |
          inputs.autofix &&
          steps.workflow-fixes.outputs.changed == 'true' &&
          (env.SECUREFIX_CLIENT_APP_ID == '' || env.SECUREFIX_SERVER_REPOSITORY == '')
        run: |
          if [ -z "${SECUREFIX_CLIENT_APP_ID}" ]; then
            echo "Workflow security fixes are needed, but SECUREFIX_CLIENT_APP_ID is not configured." >&2
          fi
          if [ -z "${SECUREFIX_SERVER_REPOSITORY}" ]; then
            echo "Workflow security fixes are needed, but SECUREFIX_SERVER_REPOSITORY is not configured." >&2
          fi
          exit 1

      - name: Request SecureFix commit
        if: |
          inputs.autofix &&
          steps.workflow-fixes.outputs.changed == 'true' &&
          env.SECUREFIX_CLIENT_APP_ID != '' &&
          env.SECUREFIX_SERVER_REPOSITORY != ''
        uses: csm-actions/securefix-action@4d885e1bcb71f4f110215c833002ce9fa0ee0fa6 # v0.6.0
        with:
          action: client
          app_id: ${{ env.SECUREFIX_CLIENT_APP_ID }}
          app_private_key: ${{ secrets.SECUREFIX_CLIENT_PRIVATE_KEY }}
          commit_message: "ci: apply workflow security fixes"
          server_repository: ${{ env.SECUREFIX_SERVER_REPOSITORY }}

      - name: Check workflow formatting
        if: ${{ !inputs.autofix }}
        run: git diff --exit-code -- .github/workflows

  pr-title:
    if: ${{ inputs.autofix && (inputs.suite == 'full' || inputs.suite == 'title') }}
    name: pr-title
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    timeout-minutes: 5

    steps:
      - name: Validate pull request title
        uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            refactor
            test
            ci
            build
            chore
            perf
            revert
          requireScope: false
