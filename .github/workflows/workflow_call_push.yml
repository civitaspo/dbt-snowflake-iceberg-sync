# Push aggregator: check-only wc-* units (no SecureFix, no pr-title).

name: Push checks (workflow_call)

on:
  workflow_call:

permissions: {}

defaults:
  run:
    shell: bash -euo pipefail {0}

jobs:
  tests:
    uses: ./.github/workflows/wc-tests.yml
    permissions:
      contents: read

  fusion-parse:
    uses: ./.github/workflows/wc-fusion-parse.yml
    permissions:
      contents: read

  lint:
    uses: ./.github/workflows/wc-lint.yml
    permissions:
      contents: read
