name: tests (workflow_call)

on:
  workflow_call:

permissions: {}

jobs:
  tests:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.13"

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up mise
        uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          version: "2026.11.3"
          install_args: "--locked"
          cache: true

      - name: Install Python dependencies
        run: uv sync --frozen

      - name: Run Python lint
        run: uv run ruff check procedure tests

      - name: Run unit tests
        run: uv run pytest tests/unit

      - name: Parse dbt package
        run: uv run dbt parse --profiles-dir tests/ci_profiles --no-version-check
