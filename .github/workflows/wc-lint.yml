# Check-only lint (workflow_call). Used from workflow_call_push.yml.

name: lint (workflow_call)

on:
  workflow_call:

permissions: {}

defaults:
  run:
    shell: bash -euo pipefail {0}

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: "2026.10.2"
          install_args: "--locked"
          cache: true

      - name: Check action pins
        env:
          PINACT_GITHUB_TOKEN: ${{ github.token }}
        run: pinact run --check --verify-comment

      - name: Ensure checkout credentials are disabled
        run: |
          disable-checkout-persist-credentials
          git diff --exit-code -- .github/workflows

      - name: Run ghalint
        run: ghalint run

      - name: Check workflow formatting
        run: git diff --exit-code -- .github/workflows
