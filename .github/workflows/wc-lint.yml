# Check-only lint (workflow_call). Used from workflow_call_push.yml.

name: lint (workflow_call)

on:
  workflow_call:

permissions: {}

defaults:
  run:
    shell: bash -euo pipefail {0}

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up mise
        uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          version: "2026.11.2"
          install_args: "--locked"
          cache: true

      - name: Check action pins
        env:
          PINACT_GITHUB_TOKEN: ${{ github.token }}
        run: pinact run --check --verify-comment

      - name: Ensure checkout credentials are disabled
        run: |
          disable-checkout-persist-credentials
          git diff --exit-code -- .github/workflows

      - name: Run ghalint
        run: ghalint run

      - name: Check workflow formatting
        run: git diff --exit-code -- .github/workflows
