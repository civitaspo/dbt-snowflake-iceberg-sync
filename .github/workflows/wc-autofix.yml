# Autofix (workflow_call). Used from workflow_call_pr.yml.

name: autofix (workflow_call)

on:
  workflow_call:
    secrets:
      CSM_CI_CLIENT_APP_PRIVATE_KEY:
        required: false

permissions: {}

defaults:
  run:
    shell: bash -euo pipefail {0}

jobs:
  autofix:
    name: autofix
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      attestations: read
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Forbid CHANGELOG edits outside release/next
        if: |
          !(
            github.head_ref == 'release/next' &&
            github.event.pull_request.head.repo.full_name == github.repository
          )
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          if git diff --name-only "${base}...${head}" | grep -qx 'CHANGELOG.md'; then
            echo "CHANGELOG.md is owned by the Release PR (git-cliff)." >&2
            echo "Do not edit it on feature PRs; use Conventional Commit subjects instead." >&2
            echo "See docs/releasing.md." >&2
            exit 1
          fi

      - name: Set up mise
        uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
        with:
          version: "2026.10.11"
          install_args: "--locked"
          cache: true

      - name: Fix action pins
        env:
          PINACT_GITHUB_TOKEN: ${{ github.token }}
        run: pinact run --verify-comment

      - name: Disable checkout credentials
        run: disable-checkout-persist-credentials

      - name: Run ghalint
        run: ghalint run

      - name: Request workflow security fixes
        uses: civitaspo/csm-ci-actions/actions/client/securefix@4eec63156502010e1d11aa0e5b7ff31a64788d3e # v0.6.0
        with:
          client-id: ${{ vars.CSM_CI_CLIENT_APP_CLIENT_ID }}
          private-key: ${{ secrets.CSM_CI_CLIENT_APP_PRIVATE_KEY }}
          server-repository: ${{ vars.CSM_CI_SERVER_REPOSITORY }}
          message: "ci: apply workflow security fixes"
